		<script>
			// 1. Ekstraksi Data dari Engine Jekyll ke Array JavaScript saat Build Time
		  	const allData = {
		    	berita: [
		      		{% for post in site.posts %}
		        		{% if post.category == 'berita' or post.categories contains 'berita' %}
							{
								title: {{ post.title | jsonify }},
								date: "{{ post.date | date: '%d %B %Y' }}",
								url: {{ post.url | relative_url | jsonify }},
								desc: {{ post.excerpt | strip_html | truncatewords: 15 | jsonify }},
								icon: "fa-newspaper"
							},
		        		{% endif %}
		      		{% endfor %}
		    	],
				pengumuman: [
					{% for post in site.posts %}
						{% if post.category == 'liputan-khusus' or post.categories contains 'pengumuman' %}
							{
								title: {{ post.title | jsonify }},
								date: "{{ post.date | date: '%d %B %Y' }}",
								url: {{ post.url | relative_url | jsonify }},
								desc: {{ post.excerpt | strip_html | truncatewords: 15 | jsonify }},
								icon: "fa-bullhorn"
							},
						{% endif %}
					{% endfor %}
				],
				artikel: [
					{% for post in site.posts %}
						{% if post.category == 'artikel' or post.categories contains 'artikel' %}
							{
								title: {{ post.title | jsonify }},
								date: "{{ post.date | date: '%d %B %Y' }}",
								url: {{ post.url | relative_url | jsonify }},
								desc: {{ post.excerpt | strip_html | truncatewords: 15 | jsonify }},
								icon: "fa-book-open"
							},
						{% endif %}
					{% endfor %}
				]
			};
		
			// 2. Konfigurasi State Navigasi
			let currentCategory = 'berita';
			const itemsPerPage = 6; // Menampilkan 6 item per halaman demi keseimbangan layout grid
			
			// 3. Fungsi Render Komponen Kartu (Card Content)
			function renderContent(page) {
				const wrapper = document.getElementById('contentWrapper');
				const data = allData[currentCategory] || [];
				
				// Tampilkan pesan jika data kosong
				if (data.length === 0) {
					wrapper.innerHTML = `
						<div class="col-12 text-center py-5">
						<div class="text-muted mb-2"><i class="fas fa-folder-open fa-3x"></i></div>
						<p class="text-muted">Belum ada postingan di kategori ${currentCategory}.</p>
						</div>`;
					document.getElementById('paginationWrapper').innerHTML = '';
					return;
				}
			
				// Kalkulasi batas data per halaman
				const start = (page - 1) * itemsPerPage;
				const end = start + itemsPerPage;
				const paginatedData = data.slice(start, end);
			
				// Menyusun elemen HTML kartu secara berkala
				wrapper.innerHTML = paginatedData.map(item => `
				<div class="col-md-6 col-lg-4">
					<div class="card h-100 border-0 shadow-sm custom-post-card">
						<div class="card-body p-4 d-flex flex-column">
							<div class="d-flex align-items-center mb-3 text-primary">
								<i class="fas ${item.icon} me-2"></i>
								<small class="fw-bold tracking-wider text-uppercase">${currentCategory}</small>
							</div>
							<h5 class="fw-bold card-title mb-2">
								<a href="${item.url}" class="text-decoration-none text-dark dynamic-title-link">${item.title}</a>
							</h5>
							<p class="text-muted small flex-grow-1">${item.desc}</p>
							<div class="d-flex justify-content-between align-items-center mt-3 border-top pt-3">
								<small class="text-muted"><i class="far fa-calendar-alt me-1"></i> ${item.date}</small>
								<a href="${item.url}" class="btn btn-link btn-sm p-0 text-primary fw-semibold text-decoration-none animate-arrow" aria-label="Baca selengkapnya mengenai ${item.title}">
									Baca <i class="fas fa-arrow-right ms-1"></i>
								</a>
							</div>
						</div>
					</div>
				</div>
				`).join('');
			
				renderPagination(data.length, page);
			}
		
			// 4. Fungsi Pembuat Kontrol Paginasi (Pagination Wrapper)
			function renderPagination(totalItems, currentPage) {
				const pagination = document.getElementById('paginationWrapper');
				const totalPages = Math.ceil(totalItems / itemsPerPage);
				let paginationHTML = '';
			
				if (totalPages <= 1) {
					pagination.innerHTML = '';
					return;
				}
			
				for (let i = 1; i <= totalPages; i++) {
					paginationHTML += `
						<li class="page-item ${i === currentPage ? 'active' : ''}">
						<a class="page-link rounded-circle mx-1 d-flex align-items-center justify-content-center" 
							style="width: 40px; height: 40px;" 
							href="javascript:void(0)" 
							onclick="renderContent(${i})">${i}</a>
						</li>`;
				}
				pagination.innerHTML = paginationHTML;
			}

			// Skrip terkait breadcumb
			/**
				 * Fungsi untuk memperbarui breadcrumb secara dinamis
				 * @param {Array} items - Array objek berupa [{teks: 'Home', link: '#'}, {teks: 'Dapodik', active: true}]
				 */
			function updateBreadcrumb(items) {
				const container = document.getElementById('breadcrumb-container');
				if (!container) return;

				// Mulai susun struktur ol khas Bootstrap
				let html = '<ol class="breadcrumb mb-0 bg-transparent p-0">';
				
				items.forEach((item, index) => {
					if (item.active || index === items.length - 1) {
						// Jika item terakhir atau ditandai aktif, jangan beri tautan klika
						html += `<li class="breadcrumb-item active" aria-current="page">${item.teks}</li>`;
					} else {
						// Jika masih ada sub-menu di bawahnya, beri tautan hidup
						html += `<li class="breadcrumb-item"><a href="${item.link || '#'}" class="text-decoration-none">${item.teks}</a></li>`;
					}
				});

				html += '</ol>';
				container.innerHTML = html;
			}

			function generateBreadcrumbFromHash() {
				// Mengambil teks hash, misal "#sekolah/dapodik" -> ["sekolah", "dapodik"]
				const hashPath = window.location.hash.replace('#', '').split('/').filter(Boolean);
				
				// Selalu mulai dari Beranda / Home
				let breadcrumbData = [{ teks: 'Beranda', link: '#' }];
				
				let currentLink = '#';
				hashPath.forEach((path, index) => {
					currentLink += path + '/';
					
					// Kapitalisasi huruf pertama untuk estetika teks (misal: "dapodik" menjadi "Dapodik")
					const formatTeks = path.charAt(0).toUpperCase() + path.slice(1);
					
					breadcrumbData.push({
						teks: formatTeks,
						link: currentLink,
						active: (index === hashPath.length - 1) // true jika elemen terakhir
					});
				});
				
				updateBreadcrumb(breadcrumbData);
			}

			// Jalankan saat halaman pertama dimuat dan setiap kali URL hash berubah
			window.addEventListener('hashchange', generateBreadcrumbFromHash());
			window.addEventListener('DOMContentLoaded', generateBreadcrumbFromHash());
		  	// Akhir skrip
		
		  	// Inisialisasi Konten Saat Halaman Pertama Kali Terbuka
		  	document.addEventListener('DOMContentLoaded', () => {
		    	renderContent(1);
		  	});
		</script>
