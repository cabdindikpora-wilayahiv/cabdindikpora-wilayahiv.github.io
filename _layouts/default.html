<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
    <head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- Pengaturan Dasar & SEO -->
	    <meta name="description" content="Portal Resmi Cabang Dinas Pendidikan, Pemuda, dan Olahraga Wilayah IV melayani administrasi dan informasi pendidikan di wilayah Kabupaten Sumbawa.">
	    <meta name="keywords" content="Cabang Dinas, Dikpora Wilayah IV, Sumbawa, Dinas Dikpora NTB, Pendidikan, Pemuda, Olahraga, Sumbawa, NTB">
	    <meta name="robots" content="index, follow">
	    <meta name="author" content="Zainul Ikhsan Hakim">
	
	    <!-- Open Graph / Meta untuk Media Sosial & WhatsApp Share -->
	    <meta property="og:title" content="Cabang Dinas Dikpora Wilayah IV - Dinas Dikpora NTB">
	    <meta property="og:description" content="Portal Resmi Cabang Dinas Pendidikan, Pemuda, dan Olahraga Wilayah IV, Dinas Dikpora Provinsi Nusa Tenggara Barat.">
	    <meta property="og:image" content="https://cabdindikpora-wilayahiv.github.io/assets/img/logo.png"> <!-- Sesuaikan dengan path logo instansi Anda -->
	    <meta property="og:url" content="https://cabdindikpora-wilayahiv.github.io">
	    <meta property="og:type" content="website">
	
	    <!-- Keamanan (Catatan penting di bawah terkait kecocokan skrip) -->
	    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net">
		
		<title>{{site.title}}</title>
		<!-- Bootstrap 5.3 CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<!-- Font Awesome 6 -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
		
		{% include style.html %}
    
    </head>
    <body>
    
        <!-- TOP STICKY BRANDING -->
        {% include branding.html %}
    
        {% include navbar.html %}
    
        <main>
            <section class="container my-5 py-4">
				<div class="row">
			    	<div class="col-lg-12">
			      		<div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
			        		<div>
			          			<p class="text-muted mb-0">{{ content }}</p>
			        		</div>
			      		</div>
					</div>
				</div>
			</section>
        </main>
    
        <!-- BOTTOM STICKY BRANDING -->
        {% include branding.html %}
    
        {% include footer.html %}
    
        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        {% include scripts.html %}
    
    </body>
</html>
